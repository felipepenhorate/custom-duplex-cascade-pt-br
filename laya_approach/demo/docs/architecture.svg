<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Onda Travel voice architecture</title>
  <desc id="desc">Browser microphone audio flows to faster-whisper, then to the Laya duplex policy, then to Qwen and Phonon, with catalog updates returning to the browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3ea"/>
      <stop offset="1" stop-color="#efe5d6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#139183"/>
      <stop offset="1" stop-color="#084844"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee8a70"/>
      <stop offset="1" stop-color="#c9543e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17231f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0e6e63"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#dd6b53"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <g opacity=".5" fill="#17231f">
    <circle cx="1090" cy="80" r="1.3"/><circle cx="1130" cy="130" r="1"/><circle cx="90" cy="620" r="1.2"/>
  </g>

  <text x="70" y="72" font-family="Georgia, serif" font-size="38" fill="#17231f" letter-spacing="-1">Onda Travel</text>
  <text x="70" y="100" font-family="ui-monospace, monospace" font-size="12" fill="#6e7d76" letter-spacing="2">FULL-DUPLEX VOICE + LIVE CATALOG</text>

  <!-- browser -->
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="250" height="180" rx="24" fill="#fffdf8" stroke="#17231f" stroke-opacity=".12"/>
  </g>
  <text x="94" y="187" font-family="ui-monospace, monospace" font-size="10" fill="#6e7d76" letter-spacing="1.6">BROWSER</text>
  <text x="94" y="218" font-family="Georgia, serif" font-size="26" fill="#17231f">Storefront + mic</text>
  <text x="94" y="244" font-family="Avenir, sans-serif" font-size="12" fill="#394943">AudioWorklet → 24 kHz PCM</text>
  <text x="94" y="264" font-family="Avenir, sans-serif" font-size="12" fill="#394943">Live cards, transcript, chips</text>
  <rect x="94" y="286" width="202" height="26" rx="13" fill="#d9ebe6"/>
  <text x="106" y="303" font-family="ui-monospace, monospace" font-size="9" fill="#084844">EN / PT-BR · interruptible audio</text>

  <!-- websocket -->
  <path d="M320 240 C390 240 390 240 440 240" stroke="#0e6e63" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="352" y="228" font-family="ui-monospace, monospace" font-size="10" fill="#0e6e63">/ws</text>

  <!-- STT -->
  <g filter="url(#shadow)">
    <rect x="450" y="160" width="240" height="160" rx="24" fill="#fffdf8" stroke="#17231f" stroke-opacity=".12"/>
  </g>
  <text x="474" y="196" font-family="ui-monospace, monospace" font-size="10" fill="#6e7d76" letter-spacing="1.6">ASR</text>
  <text x="474" y="226" font-family="Georgia, serif" font-size="25" fill="#17231f">faster-whisper</text>
  <text x="474" y="252" font-family="Avenir, sans-serif" font-size="12" fill="#394943">partials · auto-language finals</text>
  <text x="474" y="272" font-family="Avenir, sans-serif" font-size="12" fill="#394943">0.85 s semantic endpoint</text>
  <rect x="474" y="292" width="182" height="24" rx="12" fill="#f6ded6"/>
  <text x="486" y="308" font-family="ui-monospace, monospace" font-size="9" fill="#9a3c29">kind, ends_turn, system_speaking</text>

  <!-- Laya -->
  <g filter="url(#shadow)">
    <rect x="450" y="390" width="300" height="210" rx="26" fill="url(#teal)"/>
  </g>
  <text x="478" y="430" font-family="ui-monospace, monospace" font-size="10" fill="#a7ded6" letter-spacing="2">TURN-TAKING</text>
  <text x="478" y="470" font-family="Georgia, serif" font-size="40" fill="#fff">Laya v7</text>
  <text x="478" y="500" font-family="Avenir, sans-serif" font-size="12.5" fill="#c9ebe5">typed decision · 7 protocol tags</text>
  <text x="478" y="522" font-family="Avenir, sans-serif" font-size="12.5" fill="#c9ebe5">finish only on a real turn end</text>
  <rect x="478" y="544" width="236" height="28" rx="14" fill="#ffffff" fill-opacity=".12"/>
  <text x="490" y="562" font-family="ui-monospace, monospace" font-size="9.5" fill="#e6f6f3">user_finish_speaking → run content</text>
  <text x="700" y="662" font-family="Avenir, sans-serif" font-size="10" fill="#6e7d76">CC BY-NC 4.0 weights</text>

  <path d="M570 320 L570 390" stroke="#0e6e63" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="582" y="360" font-family="ui-monospace, monospace" font-size="10" fill="#0e6e63">event stream</text>

  <!-- Qwen -->
  <g filter="url(#shadow)">
    <rect x="820" y="150" width="300" height="170" rx="24" fill="#fffdf8" stroke="#17231f" stroke-opacity=".12"/>
  </g>
  <text x="844" y="186" font-family="ui-monospace, monospace" font-size="10" fill="#6e7d76" letter-spacing="1.6">CONTENT</text>
  <text x="844" y="218" font-family="Georgia, serif" font-size="25" fill="#17231f">Qwen3-4B</text>
  <text x="844" y="244" font-family="Avenir, sans-serif" font-size="12" fill="#394943">1–2 spoken sentences</text>
  <text x="844" y="264" font-family="Avenir, sans-serif" font-size="12" fill="#394943">only the filtered shortlist</text>
  <text x="844" y="284" font-family="Avenir, sans-serif" font-size="12" fill="#394943">Unsloth kernels</text>
  <text x="844" y="306" font-family="ui-monospace, monospace" font-size="9" fill="#6e7d76">Apache-2.0</text>

  <!-- Phonon -->
  <g filter="url(#shadow)">
    <rect x="820" y="380" width="300" height="150" rx="24" fill="#fffdf8" stroke="#17231f" stroke-opacity=".12"/>
  </g>
  <text x="844" y="416" font-family="ui-monospace, monospace" font-size="10" fill="#6e7d76" letter-spacing="1.6">VOICE</text>
  <text x="844" y="448" font-family="Georgia, serif" font-size="25" fill="#17231f">Phonon 40m</text>
  <text x="844" y="474" font-family="Avenir, sans-serif" font-size="12" fill="#394943">multilingual · 24 kHz stream</text>
  <text x="844" y="494" font-family="Avenir, sans-serif" font-size="12" fill="#394943">one voice, two normalizers</text>
  <text x="844" y="516" font-family="ui-monospace, monospace" font-size="9" fill="#6e7d76">CC BY-NC 4.0</text>

  <path d="M750 495 L820 455" stroke="#dd6b53" stroke-width="2" fill="none" marker-end="url(#arrowCoral)"/>
  <path d="M750 455 C790 390 795 300 820 255" stroke="#dd6b53" stroke-width="2" fill="none" marker-end="url(#arrowCoral)"/>
  <text x="770" y="343" font-family="ui-monospace, monospace" font-size="10" fill="#c9543e">finish</text>

  <!-- catalog -->
  <g filter="url(#shadow)">
    <rect x="820" y="575" width="300" height="70" rx="18" fill="#d9ebe6" stroke="#0e6e63" stroke-opacity=".2"/>
  </g>
  <text x="842" y="604" font-family="Georgia, serif" font-size="21" fill="#084844">Live catalog</text>
  <text x="842" y="625" font-family="Avenir, sans-serif" font-size="11" fill="#394943">filters + shortlist update the cards</text>
  <path d="M970 380 L970 340" stroke="#0e6e63" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/>
  <path d="M820 610 C700 610 660 610 620 600" stroke="#0e6e63" stroke-width="1.5" stroke-dasharray="4 5" fill="none" marker-end="url(#arrow)"/>
  <text x="676" y="623" font-family="ui-monospace, monospace" font-size="9.5" fill="#0e6e63">catalog event</text>

  <!-- browser return -->
  <path d="M820 600 C520 680 330 560 200 340" stroke="#0e6e63" stroke-width="1.4" stroke-dasharray="5 6" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="520" font-family="ui-monospace, monospace" font-size="9.5" fill="#0e6e63" transform="rotate(-52 300 520)">audio + JSON</text>
</svg>
